[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Angehoben fuer printpdf (Quittung als PDF, siehe quittung.rs) - braucht
# mindestens 1.88. GitHub Actions installiert ohnehin immer "stable".
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# "bundled": SQLite wird mit einkompiliert, auf dem Windows-PC braucht es
# keine separate Installation - genau das will Stefan.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Passwort-Hashing ohne C-Abhaengigkeiten - baut sauber auch beim
# Cross-Compile fuer Windows in der GitHub-Actions-Pipeline.
argon2 = "0.5"
# Wird von argon2/password-hash fuer den Zufallsgenerator (OsRng) gebraucht -
# nicht direkt aufgerufen, aber noetig fuer die Feature-Vereinheitlichung.
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# Plattform-eigener Datenordner (unter Windows: %APPDATA%) fuer die
# Datenbankdatei und die automatische Sicherung.
dirs = "5"
thiserror = "1"
# Liest Excel-Dateien (.xlsx/.xls) und CSV fuer den datei-basierten Import
# (Kunden/Stunden) - "dates": damit Datum/Uhrzeit-Zellen als echtes Datum
# statt als rohe Excel-Seriennummer ankommen.
calamine = { version = "0.30.1", features = ["dates"] }
# Erzeugt die Quittung als eigenstaendiges PDF (quittung.rs) statt nur
# ueber window.print() - der native Windows-Druckdialog fuegt dort eine
# Kopf-/Fusszeile (Datum, Seitentitel, URL, Seitenzahl) hinzu, die sich
# nicht abschalten laesst; ein selbst erzeugtes PDF hat so etwas nicht.
printpdf = { version = "0.12.8", features = ["html", "jpeg", "png"] }
# Automatisches Update (update.rs): holt version.json und die neue
# Installationsdatei von der GitHub-Release-Seite "Neueste Version".
ureq = "2"
