[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# "bundled": SQLite wird mit einkompiliert, auf dem Windows-PC braucht es
# keine separate Installation - genau das will Stefan.
rusqlite = { version = "0.32", features = ["bundled"] }
# Passwort-Hashing ohne C-Abhaengigkeiten - baut sauber auch beim
# Cross-Compile fuer Windows in der GitHub-Actions-Pipeline.
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# Plattform-eigener Datenordner (unter Windows: %APPDATA%) fuer die
# Datenbankdatei und die automatische Sicherung.
dirs = "5"
thiserror = "1"
