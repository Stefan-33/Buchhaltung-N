# Baut die Windows-Installationsdatei automatisch in der Cloud - genau der
# Schritt, den wir auf einer Linux-Umgebung nicht selbst machen koennen.
# GitHub stellt den Windows-Rechner dafuer kostenlos zur Verfuegung.
#
# Stefans Wunsch: nicht jedes Mal durch "Actions" -> den richtigen Lauf ->
# "Artifacts" klicken muessen (die laufen zudem irgendwann ab). Darum landet
# die fertige .msi/.exe zusaetzlich auf einer einzigen, immer gleichen
# Release-Seite ("Neueste Version") - ein Lesezeichen reicht, die Datei dort
# ist nach jedem Push automatisch die aktuellste.

name: Windows-Installationsdatei bauen

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tauri-CLI installieren
        run: npm install -g @tauri-apps/cli@^2

      # Kennung fuer das automatische Update im Programm (update.rs): der
      # Commit wird ins Programm eingebaut, das Datum (Schweizer Zeit) zeigt
      # es unter Einstellungen an.
      - name: Build-Kennung festlegen
        id: kennung
        shell: pwsh
        run: |
          $zeit = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'W. Europe Standard Time')
          "datum=$($zeit.ToString('dd.MM.yyyy HH:mm'))" >> $env:GITHUB_OUTPUT

      - name: Windows-Installer bauen (.msi und .exe)
        run: tauri build
        env:
          ATELIERBUCH_BUILD: ${{ github.sha }}
          ATELIERBUCH_BUILD_DATUM: ${{ steps.kennung.outputs.datum }}

      # version.json: daran erkennt das installierte Programm, dass es eine
      # neuere Version gibt, und welche Datei es herunterladen soll.
      - name: version.json fuer das automatische Update schreiben
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          @{ build = "${{ github.sha }}"; datum = "${{ steps.kennung.outputs.datum }}"; datei = $exe.Name.Replace(' ', '.') } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM src-tauri/target/release/bundle/version.json
          Get-Content src-tauri/target/release/bundle/version.json

      - name: Installationsdateien hochladen (Actions-Lauf, als Sicherung)
        uses: actions/upload-artifact@v4
        with:
          name: Atelierbuch-Straub-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Immer dieselbe Release-Seite ("Neueste Version") - braucht kein
      # Durchklicken durch einzelne Actions-Laeufe, kein Login ausser dem
      # normalen GitHub-Login, und laeuft nie wie ein Artifact ab.
      - name: Als "Neueste Version" veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste-version
          name: Neueste Version
          body: |
            Automatisch gebaut aus dem letzten Push (Branch `${{ github.ref_name }}`).
            Einfach die passende Datei unten anklicken (.msi empfohlen) -
            diese Seite zeigt immer die zuletzt gebaute Version.
          make_latest: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/version.json
